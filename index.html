<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra Admin</title>
<style>
  body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:40px 16px}
  .box{display:inline-block;margin:12px;padding:24px 32px;background:#222;border-radius:16px}
  .n{font-size:56px;font-weight:bold;color:#4ade80}
  #err{color:#f87171;margin-top:20px}
</style>
</head>
<body>
<h1>Tra Admin</h1>
<div class="box"><div class="n" id="online">-</div>កំពុង Online</div>
<div class="box"><div class="n" id="total">-</div>អ្នកប្រើសរុប</div>
<div id="err"></div>
<script>
async function load() {
  var err = document.getElementById("err");
  try {
    var r = await fetch("/api/stats");
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) { err.textContent = "Error " + r.status + ": " + (d.error || ""); return; }
    err.textContent = "";
    document.getElementById("online").textContent = d.online;
    document.getElementById("total").textContent = d.total;
  } catch (e) { err.textContent = "Network error: " + e.message; }
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
